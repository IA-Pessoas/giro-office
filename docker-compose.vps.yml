# Tag local das imagens `workspace-*` (isolamento por stack na mesma VPS). Definir
# `WORKSPACE_VPS_IMAGE_TAG` no ambiente ou em `.env` na raiz; omissão = `vps`.
x-service-defaults: &service_defaults
  dns:
    - 1.1.1.1
    - 8.8.8.8
  dns_opt:
    - use-vc

services:
  reverse-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    command:
      [
        "/bin/sh",
        "-c",
        "sh /opt/generate-nginx-config.sh && exec nginx -g 'daemon off;'",
      ]
    depends_on:
      gateway:
        condition: service_healthy
    env_file:
      - .env.vps.reverse-proxy
    ports:
      - "8085:80"
      # - "443:443"
    volumes:
      - ./docker/nginx/generate-nginx-config.sh:/opt/generate-nginx-config.sh:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    networks:
      - edge
      - backend

  web:
    <<: *service_defaults
    image: workspace-web:${WORKSPACE_VPS_IMAGE_TAG:-vps}
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3010}
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://gateway:3010}
    env_file:
      - .env.vps.web
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - edge
      - backend

  gateway:
    <<: *service_defaults
    image: workspace-gateway:${WORKSPACE_VPS_IMAGE_TAG:-vps}
    restart: unless-stopped
    command: ["node", "dist/services/gateway/src/server.js"]
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        WORKSPACE_PACKAGE: "@workspace/gateway"
        SERVICE_DIR: services/gateway
    env_file:
      - .env.vps.gateway
    ports:
      - "3010:3010"
    depends_on:
      organization-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      department-service:
        condition: service_healthy
      task-service:
        condition: service_healthy
      project-service:
        condition: service_healthy
      client-service:
        condition: service_healthy
      fiscal-service:
        condition: service_healthy
      contabil-service:
        condition: service_healthy
      regularize-service:
        condition: service_healthy
      rh-service:
        condition: service_healthy
      ti-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3010/ready').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - edge
      - backend

  organization-service:
    <<: *service_defaults
    image: workspace-organization-service:${WORKSPACE_VPS_IMAGE_TAG:-vps}
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        WORKSPACE_PACKAGE: "@workspace/organization-service"
        SERVICE_DIR: services/organization-service
    env_file:
      - .env.vps.organization-service
    expose:
      - "3031"
    healthcheck:
