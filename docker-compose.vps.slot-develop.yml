# Sobreposição de portas para o slot **develop** na mesma VPS que staging.
# Staging (`workspace-staging`): só `docker-compose.vps.yml` → proxy **8085**, gateway **3010**.
# Develop (`workspace-develop`): base + este ficheiro → proxy **8086**, gateway **3011**.
#
# Uso na VPS (deploy CI):
#   docker compose -f docker-compose.vps.yml -f docker-compose.vps.slot-develop.yml -p workspace-develop ...
services:
  reverse-proxy:
    ports:
      - "8086:80"
  gateway:
    ports:
      - "3011:3010"
