name: Quality

# Substitui os seis workflows *-cicd.yml removidos em 2026-09-18, que estavam
# 100% comentados desde 2026-06-01 e falhavam na validacao a cada push.
# Cobre so qualidade de codigo; o deploy continua manual
# (`pnpm deploy:production`, ver docs/production-deploy.md).

on:
  pull_request:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Placeholder: `prisma generate` roda no typecheck e exige a variavel,
  # mas nenhum gate abre conexao com o banco.
  DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/giro_ci

jobs:
  gates:
    name: quality/gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Enable pinned pnpm
        run: |
          corepack enable
          test "$(corepack pnpm --version)" = "10.26.0"

      - name: Install frozen dependencies without lifecycle scripts
        run: corepack pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint and format
        run: corepack pnpm check

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Script and policy tests
        run: corepack pnpm test:scripts

      - name: Harness, smoke coverage and compose gates
        run: |
          corepack pnpm harness:test
          corepack pnpm smoke:coverage
          corepack pnpm security:compose

  # Os testes unitarios dos servicos sao instaveis por causa da suite, nao do codigo:
  # o supertest sobe um servidor efemero POR REQUISICAO, e sob carga uma porta recem
  # liberada e reusada por outro servidor antes de o cliente conectar - a resposta vem
  # do servidor errado (404/JSON truncado) em um servico aleatorio a cada execucao.
  # Medido em 2026-09-18: ~2 de 9 execucoes passam, com ou sem paralelismo do turbo.
  # Enquanto isso nao for corrigido na suite, o job roda e fica visivel, mas nao bloqueia
  # o merge - um gate que falha 3 em cada 4 vezes seria ignorado em uma semana.
  # Para tornar bloqueante: remover o `continue-on-error` abaixo.
  tests:
    name: quality/tests (nao bloqueante)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Enable pinned pnpm
        run: |
          corepack enable
          test "$(corepack pnpm --version)" = "10.26.0"

      - name: Install frozen dependencies without lifecycle scripts
        run: corepack pnpm install --frozen-lockfile --ignore-scripts

      - name: Unit and integration tests
        run: corepack pnpm test
