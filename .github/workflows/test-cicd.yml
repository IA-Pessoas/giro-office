# CI para a branch feature/CICD_test (dispara em push após merge de PR; combine com branch protection para exigir aprovação).
#
# Segurança: `.env.vps.*` está em `.gitignore` na raiz; os arquivos só existem no runner durante o job.
# Segredos vazios no GitHub viram env definida com string vazia — `set -u` não detecta isso; por isso
# validamos não-vazio antes de gravar.
#
# Segredos do repositório → arquivos na raiz (gitignored). Pares: scripts/ci/vps-secrets.manifest.
#
# Opcional (somente se usar --profile audit no compose): ENV_VPS_AUDIT_SERVICE → .env.vps.audit-service
#
# Pós-merge: cadastrar todos os segredos em Settings → Secrets and variables → Actions,
# garantir DATABASE_URL/SUPABASE acessíveis a partir dos runners do GitHub e validar na aba Actions.
#
name: Teste CICD

on:
  push:
    branches:
      - feature/CICD-test
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - feature/CICD
  workflow_dispatch:

concurrency:
  group: test-cicd-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  quality:
    name: Qualidade (Biome, typecheck, testes)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # prisma.config.ts (infra) exige DATABASE_URL. Use placeholder (não use secret vazio): `prisma generate` não conecta ao DB.
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci_ci_typecheck?schema=public
    steps:
      - uses: actions/checkout@v4

      # `setup-node` com `cache: pnpm` exige que `pnpm` já exista no PATH (documentação setup-node).
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Auditoria de dependências
        run: pnpm audit:ci

      - name: Biome check
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes
        run: pnpm test

  docker-stack:
    name: Docker Compose (stack VPS)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Materializar .env.vps.* a partir dos segredos
        env:
          ENV_VPS_REVERSE_PROXY: ${{ secrets.ENV_VPS_REVERSE_PROXY }}
          ENV_VPS_GATEWAY: ${{ secrets.ENV_VPS_GATEWAY }}
          ENV_VPS_ORGANIZATION_SERVICE: ${{ secrets.ENV_VPS_ORGANIZATION_SERVICE }}
          ENV_VPS_USER_SERVICE: ${{ secrets.ENV_VPS_USER_SERVICE }}
          ENV_VPS_TASK_SERVICE: ${{ secrets.ENV_VPS_TASK_SERVICE }}
          ENV_VPS_PROJECT_SERVICE: ${{ secrets.ENV_VPS_PROJECT_SERVICE }}
          ENV_VPS_CLIENT_SERVICE: ${{ secrets.ENV_VPS_CLIENT_SERVICE }}
          ENV_VPS_RH_SERVICE: ${{ secrets.ENV_VPS_RH_SERVICE }}
        run: bash scripts/ci/materialize-vps-env.sh

      # BuildKit acelera builds; `docker compose build` nos runners do GHA não aceita
      # --cache-to/--cache-from (versão do plugin Compose). Cache entre jobs: bake ou registry.
      - name: Build imagens Compose
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
        run: |
          set -eo pipefail
          echo "::group::docker compose build"
          docker compose -f docker-compose.vps.yml build
          echo "::endgroup::"

      - name: Subir stack e aguardar healthchecks
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
        run: |
          set -eo pipefail
          docker compose version
          docker compose -f docker-compose.vps.yml up -d --wait --wait-timeout 900

      - name: Docker Compose down
        if: always()
        run: |
          # -v remove volumes nomeados; útil também em runner self-hosted (evita nomes/dados presos).
          docker compose -f docker-compose.vps.yml down -v || true

  staging-environment:
    name: Staging — Docker, scan, integração, smoke, E2E
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Instalar dependências (pnpm smoke / Playwright em app)
        run: pnpm install --frozen-lockfile

      - uses: docker/setup-buildx-action@v3

      - name: Materializar .env.vps.* a partir dos segredos
        env:
          ENV_VPS_REVERSE_PROXY: ${{ secrets.ENV_VPS_REVERSE_PROXY }}
          ENV_VPS_GATEWAY: ${{ secrets.ENV_VPS_GATEWAY }}
          ENV_VPS_ORGANIZATION_SERVICE: ${{ secrets.ENV_VPS_ORGANIZATION_SERVICE }}
          ENV_VPS_USER_SERVICE: ${{ secrets.ENV_VPS_USER_SERVICE }}
          ENV_VPS_TASK_SERVICE: ${{ secrets.ENV_VPS_TASK_SERVICE }}
          ENV_VPS_PROJECT_SERVICE: ${{ secrets.ENV_VPS_PROJECT_SERVICE }}
          ENV_VPS_CLIENT_SERVICE: ${{ secrets.ENV_VPS_CLIENT_SERVICE }}
          ENV_VPS_RH_SERVICE: ${{ secrets.ENV_VPS_RH_SERVICE }}
        run: bash scripts/ci/materialize-vps-env.sh

      - name: "[Build] Imagens Docker (docker-compose.vps.yml)"
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
        run: |
          set -eo pipefail
          docker compose -f docker-compose.vps.yml build

      # Docker Hub oficial: aquasec/trivy (aquasecurity/trivy não existe como repo no Hub).
      # Lista de imagens: scripts/ci/list-workspace-vps-images.sh (deriva de docker-compose.vps.yml).
      # Política: CRITICAL quebra o pipeline; HIGH é reportado no log (informativo) para monitoramento.
      # Cache do DB em /tmp/trivy-cache evita baixar ~91 MiB por imagem escaneada.
      - name: "[Scan] Trivy — imagens workspace (gate: CRITICAL; HIGH é informativo)"
        run: |
          set -eo pipefail
          mkdir -p /tmp/trivy-cache
          mapfile -t images < <(bash scripts/ci/list-workspace-vps-images.sh)
          scan() {
            local img="$1"
            local severity="$2"
            local exit_code="$3"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v /tmp/trivy-cache:/root/.cache/trivy \
              aquasec/trivy:0.58.2 image \
              --scanners vuln \
              --severity "$severity" \
              --exit-code "$exit_code" \
              --ignore-unfixed \
              "$img"
          }
          for img in "${images[@]}"; do
            echo "::group::Trivy (informativo HIGH,CRITICAL) — $img"
            scan "$img" "HIGH,CRITICAL" 0 || true
            echo "::endgroup::"
          done
          for img in "${images[@]}"; do
            echo "::group::Trivy (gate CRITICAL) — $img"
            scan "$img" "CRITICAL" 1
            echo "::endgroup::"
          done

      - name: "[Deploy temporário] Subir stack e aguardar healthchecks"
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
        run: |
          set -eo pipefail
          docker compose version
          docker compose -f docker-compose.vps.yml up -d --wait --wait-timeout 900

      - name: "[Integration] Vitest — client-service com Postgres (opcional)"
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          CLIENT_SERVICE_INTEGRATION: "1"
        run: |
          set -eo pipefail
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::Secret STAGING_DATABASE_URL não configurado — pulando testes de integração com Postgres."
            exit 0
          fi
          pnpm --filter @workspace/client-service test

      - name: "[Smoke + integração HTTP] Contrato público via gateway (pnpm smoke)"
        run: pnpm smoke

      - name: "[E2E] Playwright (executa quando @playwright/test existir no workspace)"
        run: |
          set -eo pipefail
          if [ ! -d app/node_modules/@playwright/test ] && [ ! -d node_modules/@playwright/test ]; then
            echo "::notice::Playwright não instalado — adicione @playwright/test ao app e playwright.config.ts para ativar E2E."
            exit 0
          fi
          cd app
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test

      - name: Encerrar stack
        if: always()
        run: |
          docker compose -f docker-compose.vps.yml down -v || true

  # ── Simulação da fase Main/Production (espelha main-cicd.yml) ────────────
  # `production` (GitHub Environment) é omitida aqui para o job não exigir aprovação em teste.
  # Risco de schema: migrate → candidato+smoke; sem rollback de DDL (ver comentário no main-cicd).

  main-promote-image:
    name: Main (teste) — promote imutável
    needs: staging-environment
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      promoted_tag: ${{ steps.version.outputs.tag }}
      has_registry: ${{ steps.check.outputs.has }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        name: Registro de imagem?
        env:
          R: ${{ secrets.DOCKER_REGISTRY_URL }}
        run: |
          if [ -n "$R" ]; then echo "has=true" >> "$GITHUB_OUTPUT"
          else echo "has=false" >> "$GITHUB_OUTPUT" && echo "::notice::Sem registry: 1x build e TAR; jobs seguintes não rebuildam."
          fi
      - uses: docker/setup-buildx-action@v3
      - name: Materializar .env.vps.* a partir dos segredos
        env:
          ENV_VPS_REVERSE_PROXY: ${{ secrets.ENV_VPS_REVERSE_PROXY }}
          ENV_VPS_GATEWAY: ${{ secrets.ENV_VPS_GATEWAY }}
          ENV_VPS_ORGANIZATION_SERVICE: ${{ secrets.ENV_VPS_ORGANIZATION_SERVICE }}
          ENV_VPS_USER_SERVICE: ${{ secrets.ENV_VPS_USER_SERVICE }}
          ENV_VPS_TASK_SERVICE: ${{ secrets.ENV_VPS_TASK_SERVICE }}
          ENV_VPS_PROJECT_SERVICE: ${{ secrets.ENV_VPS_PROJECT_SERVICE }}
          ENV_VPS_CLIENT_SERVICE: ${{ secrets.ENV_VPS_CLIENT_SERVICE }}
          ENV_VPS_RH_SERVICE: ${{ secrets.ENV_VPS_RH_SERVICE }}
        run: bash scripts/ci/materialize-vps-env.sh
      - name: Calcular tag de origem (staging) no registry
        id: staging_tag
        env:
          S_STAGING: ${{ secrets.DOCKER_STAGING_TAG }}
        run: |
          if [ -n "$S_STAGING" ]; then echo "resolved=$S_STAGING" >> "$GITHUB_OUTPUT"; exit 0; fi
          RES=$(bash scripts/ci/resolve-docker-staging-source-tag.sh)
          echo "resolved=$RES" >> "$GITHUB_OUTPUT"
      - name: Tag promovida (teste = short sha)
        id: version
        run: |
          echo "tag=sha-$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - name: Login no registry
        if: steps.check.outputs.has == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY_URL }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
      - name: "Pull+retag (registry)"
        if: steps.check.outputs.has == 'true'
        env:
          DOCKER_STAGING_RESOLVED_TAG: ${{ steps.staging_tag.outputs.resolved }}
          DOCKER_REGISTRY_URL: ${{ secrets.DOCKER_REGISTRY_URL }}
        run: bash scripts/ci/compose-vps-pull-and-tag.sh
      - name: "Build (sem registry)"
        if: steps.check.outputs.has != 'true'
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
        run: docker compose -f docker-compose.vps.yml build
      - if: steps.check.outputs.has != 'true'
        run: bash scripts/ci/compose-vps-image-save.sh
      - if: steps.check.outputs.has != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: workspace-vps-images
          path: /tmp/workspace-vps-images.tar
          retention-days: 2
          if-no-files-found: error
      - name: Push
        if: steps.check.outputs.has == 'true'
        env:
          DOCKER_REGISTRY_URL: ${{ secrets.DOCKER_REGISTRY_URL }}
          PROMOTED_TAG: ${{ steps.version.outputs.tag }}
        run: bash scripts/ci/compose-vps-promote-push.sh

  main-database-migrations:
    name: Main (teste) — prisma migrate
    needs: main-promote-image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: ${{ github.repository }}-prisma-migrate-test
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
    steps:
      - name: Há PROD_DATABASE_URL? (secrets não podem ir em if:)
        id: prod_check
        env:
          P: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -n "$P" ]; then echo "has_prod=true" >> "$GITHUB_OUTPUT"
          else echo "has_prod=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Pular migrations (sem PROD nesta simulação)
        if: steps.prod_check.outputs.has_prod == 'false'
        run: echo "::notice::PROD_DATABASE_URL vazio — migrations de teste ignoradas (em main real seria erro)."
      - uses: actions/checkout@v4
        if: steps.prod_check.outputs.has_prod == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.prod_check.outputs.has_prod == 'true'
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        if: steps.prod_check.outputs.has_prod == 'true'
        with:
          node-version: "22"
          cache: pnpm
      - if: steps.prod_check.outputs.has_prod == 'true'
        name: pnpm
        run: pnpm install --frozen-lockfile
      - if: steps.prod_check.outputs.has_prod == 'true'
        name: migrate
        run: |
          echo "::notice::Migrations antes do smoke: falha no deploy não reverte DDL (expand/contract)."
          pnpm --filter @workspace/infra exec prisma migrate deploy

  main-candidate:
    name: Main (teste) — candidato + smoke
    needs: [main-database-migrations, main-promote-image]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@v3
      - name: Materializar .env.vps.* a partir dos segredos
        env:
          ENV_VPS_REVERSE_PROXY: ${{ secrets.ENV_VPS_REVERSE_PROXY }}
          ENV_VPS_GATEWAY: ${{ secrets.ENV_VPS_GATEWAY }}
          ENV_VPS_ORGANIZATION_SERVICE: ${{ secrets.ENV_VPS_ORGANIZATION_SERVICE }}
          ENV_VPS_USER_SERVICE: ${{ secrets.ENV_VPS_USER_SERVICE }}
          ENV_VPS_TASK_SERVICE: ${{ secrets.ENV_VPS_TASK_SERVICE }}
          ENV_VPS_PROJECT_SERVICE: ${{ secrets.ENV_VPS_PROJECT_SERVICE }}
          ENV_VPS_CLIENT_SERVICE: ${{ secrets.ENV_VPS_CLIENT_SERVICE }}
          ENV_VPS_RH_SERVICE: ${{ secrets.ENV_VPS_RH_SERVICE }}
        run: bash scripts/ci/materialize-vps-env.sh
      - name: Login
        if: needs.main-promote-image.outputs.has_registry == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY_URL }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
      - name: TAR
        if: needs.main-promote-image.outputs.has_registry != 'true'
        uses: actions/download-artifact@v4
        with:
          name: workspace-vps-images
      - name: load
        if: needs.main-promote-image.outputs.has_registry != 'true'
        run: |
          set -eo pipefail
          TAR=$(find . -maxdepth 2 -name 'workspace-vps-images.tar' 2>/dev/null | head -1)
          if [ -z "$TAR" ]; then find . -maxdepth 3 -type f; echo "::error::TAR do artefato"; exit 1; fi
          docker load -i "$TAR"
      - name: pull
        if: needs.main-promote-image.outputs.has_registry == 'true'
        env:
          DOCKER_REGISTRY_URL: ${{ secrets.DOCKER_REGISTRY_URL }}
          DOCKER_IMAGE_TAG: ${{ needs.main-promote-image.outputs.promoted_tag }}
        run: bash scripts/ci/compose-vps-pull-by-tag.sh
      - name: up
        env:
          DOCKER_BUILDKIT: 1
        run: |
          set -eo pipefail
          docker compose -p workspace-main -f docker-compose.vps.yml up -d --wait --wait-timeout 900 --no-build
      - name: Log em falha
        if: failure()
        run: |
          docker compose -p workspace-main -f docker-compose.vps.yml ps -a || true
          docker compose -p workspace-main -f docker-compose.vps.yml logs --tail=200 || true
      - if: success()
        name: smoke
        run: |
          set -eo pipefail
          timeout 20m pnpm smoke
      - if: always()
        run: docker compose -p workspace-main -f docker-compose.vps.yml down -v || true

  main-dast:
    name: Main (teste) — DAST
    needs: [main-candidate, main-promote-image]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Resolver modo DAST
        id: dast_mode
        env:
          DAST_TARGET_URL: ${{ secrets.DAST_TARGET_URL }}
        run: bash scripts/ci/dast-resolve-mode.sh
      - if: steps.dast_mode.outputs.use_local_stack == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Artefato TAR (sem registry)
        if: steps.dast_mode.outputs.use_local_stack == 'true' && needs.main-promote-image.outputs.has_registry != 'true'
        uses: actions/download-artifact@v4
        with:
          name: workspace-vps-images
      - name: Stack local para ZAP
        id: local_dast
        if: steps.dast_mode.outputs.use_local_stack == 'true'
        env:
          DAST_COMPOSE_PROJECT: workspace-dast
          HAS_REGISTRY: ${{ needs.main-promote-image.outputs.has_registry }}
          DOCKER_IMAGE_TAG: ${{ needs.main-promote-image.outputs.promoted_tag }}
          DOCKER_REGISTRY_URL: ${{ secrets.DOCKER_REGISTRY_URL }}
          DOCKER_REGISTRY_USERNAME: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
          ENV_VPS_REVERSE_PROXY: ${{ secrets.ENV_VPS_REVERSE_PROXY }}
          ENV_VPS_GATEWAY: ${{ secrets.ENV_VPS_GATEWAY }}
          ENV_VPS_ORGANIZATION_SERVICE: ${{ secrets.ENV_VPS_ORGANIZATION_SERVICE }}
          ENV_VPS_USER_SERVICE: ${{ secrets.ENV_VPS_USER_SERVICE }}
          ENV_VPS_TASK_SERVICE: ${{ secrets.ENV_VPS_TASK_SERVICE }}
          ENV_VPS_PROJECT_SERVICE: ${{ secrets.ENV_VPS_PROJECT_SERVICE }}
          ENV_VPS_CLIENT_SERVICE: ${{ secrets.ENV_VPS_CLIENT_SERVICE }}
          ENV_VPS_RH_SERVICE: ${{ secrets.ENV_VPS_RH_SERVICE }}
        run: bash scripts/ci/dast-local-stack.sh
      - name: Logs DAST em falha
        if: failure() && steps.dast_mode.outputs.use_local_stack == 'true'
        run: |
          docker compose -p workspace-dast -f docker-compose.vps.yml ps -a || true
          docker compose -p workspace-dast -f docker-compose.vps.yml logs --tail=200 || true
      - name: "ZAP (URL pública)"
        if: success() && steps.dast_mode.outputs.has_public_url == 'true'
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ secrets.DAST_TARGET_URL }}
          fail_action: true
          allow_issue_writing: false
          cmd_options: "-a -T 5"
      - name: "ZAP (stack no runner)"
        if: success() && steps.dast_mode.outputs.use_local_stack == 'true'
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ steps.local_dast.outputs.dast_url }}
          fail_action: true
          allow_issue_writing: false
          cmd_options: "-a -T 5"
      - if: always() && steps.dast_mode.outputs.use_local_stack == 'true'
        run: docker compose -p workspace-dast -f docker-compose.vps.yml down -v || true
