# Staging CI/CD — PR: stack completa no runner (Trivy, smoke, E2E). Push branch `staging`:
# quality → build/push registry → deploy na VPS (slot `/opt/workspace-staging`, projeto `workspace-staging`).
# Deploy da branch `develop` está em develop-cicd.yml.
#
# Segredos obrigatórios (registry + env VPS): ver scripts/ci/vps-secrets.manifest e variáveis materializadas abaixo.
#   DOCKER_REGISTRY_URL, DOCKER_REGISTRY_USERNAME, DOCKER_REGISTRY_PASSWORD
#   VPS_HOST, VPS_USER, e VPS_SSH_PRIVATE_KEY (recomendado) ou VPS_SSH_PASSWORD
# Na VPS: clone em /opt/workspace-staging (primeira vez manual ou bootstrap).
#
# Com DOCKER_REGISTRY_* configurado, imagens {registry}/{serviço}:<GITHUB_SHA> — o main faz pull dessa tag.

name: Staging CI/CD

on:
  push:
    branches:
      - staging
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: staging-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Qualidade (Biome, typecheck, testes)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci_ci_typecheck?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Auditoria de dependências
        run: pnpm audit:ci

      - name: Biome check
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes unitários / pacote (Vitest em serviços)
        run: pnpm test

