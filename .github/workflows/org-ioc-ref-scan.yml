name: Organization IOC and Ref Scan

on:
  schedule:
    - cron: "17 7 * * 1-5"

permissions:
  contents: read

jobs:
  scan:
    name: security/org-ioc-ref-scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: develop
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Coletar IOCs e anomalias de refs
        env:
          GITHUB_ORG_SCANNER_TOKEN: ${{ secrets.GITHUB_ORG_SCANNER_TOKEN }}
        run: >-
          node scripts/org-ioc-ref-scan.mjs
          --org IA-Pessoas
          --workspace "${RUNNER_TEMP}/org-ioc-ref-scan"
          --report "${RUNNER_TEMP}/org-ioc-ref-scan-report.json"
          --fail-on-findings

      - name: Publicar somente relatório sanitizado
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: org-ioc-ref-scan-report
          path: ${{ runner.temp }}/org-ioc-ref-scan-report.json
          retention-days: 7
          if-no-files-found: ignore
