name: Credential Policy

on:
  pull_request:
  push:
    branches:
      - develop
      - main
      - staging
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan credential and workflow policy
        run: node scripts/credential-policy.mjs . --report credential-policy-report.json
      - name: Upload sanitized report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credential-policy-report
          path: credential-policy-report.json
          if-no-files-found: ignore
          retention-days: 7
