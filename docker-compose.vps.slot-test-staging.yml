# Portas do slot de **teste** staging (`workspace-teste-staging`, branch `test/deploy-staging`).
# Staging real usa só o compose base (8085 / 3010).
# `!override`: evita publicar em paralelo 8085/3010 do compose base.
services:
  reverse-proxy:
    ports: !override
      - "8086:80"
  gateway:
    ports: !override
      - "3012:3010"
